# Cotações quase em tempo real na seção Mercado do Hub.
# No pregão (dias úteis, 9h30 às 18h30 de Brasília) grava a cada ~60 s um documento no
# Firestore do rico-hub que o Hub lê direto.
#
# v40: corrente contínua. O agendamento do GitHub chegou a passar um dia inteiro sem disparar
# (16/11: nenhum turno no pregão). Agora cada turno fica de pé ~4h45 — gravando no pregão e só
# esperando fora dele — e, ao terminar, já deixa o próximo na fila, a qualquer hora e em qualquer
# dia. Assim sempre há um turno vivo, inclusive na abertura de segunda. Os horários abaixo e a
# rotina "Publicar Hub e Radar" (que confere a cada vez que roda) só religam a corrente se ela cair.
name: Mercado ao vivo

on:
  schedule:
    - cron: '20 11,12 * * 1-5'   # 8h20 e 9h20 de Brasília: religa a corrente se ela tiver caído
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mercado-ao-vivo
  cancel-in-progress: false

jobs:
  ao-vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Marca o início do turno
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cotações a cada minuto no pregão, até o fim do turno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Enquanto for dia útil das 7h às 21h, dispara a coleta completa (Publicar Hub e Radar)
          # a cada ~20 min: os gráficos e o mercado.json não dependem do agendamento do GitHub.
          ( while true; do
              sleep 1200
              d=$(TZ=America/Sao_Paulo date +%u); h=$((10#$(TZ=America/Sao_Paulo date +%H)))
              if [ "$d" -le 5 ] && [ "$h" -ge 7 ] && [ "$h" -lt 21 ]; then
                gh workflow run publicar.yml --ref main >/dev/null 2>&1 && echo "coleta completa disparada $(date -u +%H:%M)"
              fi
            done ) &
          python mercado_vivo.py 285

      # Passa o bastão: ao terminar, deixa o próximo turno na fila, a qualquer hora.
      # Só não passa se o turno durou menos de 10 min (falhou logo de cara), para não
      # ficar se chamando em sequência — aí quem religa é o agendamento ou a publicação.
      - name: Passa o bastão para o próximo turno
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rodou=$(( $(date +%s) - ${INICIO:-$(date +%s)} ))
          if [ "$rodou" -ge 600 ]; then
            gh workflow run mercado-ao-vivo.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "próximo turno na fila"
          else
            echo "turno curto (${rodou}s): sem bastão"
          fi
