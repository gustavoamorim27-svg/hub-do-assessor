# Publica o Hub no GitHub Pages e renova o Radar de mercado (radar.enc).
# Roda a cada push na main e, nos dias úteis, a cada 15–30 min de manhã e à
# tarde (o Morning Call da XP sai por volta das 8h30 de Brasília).
name: Publicar Hub e Radar

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 10-12 * * 1-5'      # 7h–9h45 de Brasília
    - cron: '*/30 13-23 * * 1-5'      # 10h–20h30
    - cron: '0 */3 * * 0,6'           # fim de semana
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependência
        run: pip install --quiet cryptography==43.0.3

      - name: Coletar feeds do Radar
        id: coleta
        continue-on-error: true
        run: python radar_coletar.py

      - name: Sem coleta nova? Mantém o radar que está no ar
        if: steps.coleta.outcome != 'success'
        run: |
          curl -fsS -m 30 -o radar.enc "https://gustavoamorim27-svg.github.io/hub-do-assessor/radar.enc" \
            && echo "radar anterior mantido" || echo "sem radar anterior"

      - name: Mercado anterior (para acumular o histórico dos juros)
        run: |
          curl -fsS -m 30 -o mercado_anterior.json "https://gustavoamorim27-svg.github.io/hub-do-assessor/mercado.json" \
            || echo '{}' > mercado_anterior.json

      - name: Coletar dados de mercado
        id: mercado
        continue-on-error: true
        run: python mercado_coletar.py mercado_anterior.json

      - name: Sem mercado novo? Mantém o que está no ar
        if: steps.mercado.outcome != 'success'
        run: grep -q '"series"' mercado_anterior.json && cp mercado_anterior.json mercado.json || true

      - name: Montar o site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'radar_coletar.py' --exclude 'mercado_coletar.py' --exclude 'mercado_vivo.py' --exclude 'mercado_anterior.json' --exclude '*.zip' ./ _site/
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # O agendamento do GitHub às vezes fica horas sem disparar. Como esta publicação roda a cada
      # push e em vários horários, ela confere se a coleta ao vivo está de pé no pregão e, se não
      # estiver, liga de novo (as duas rotinas passam a se socorrer).
      - name: Coleta ao vivo parada no pregão? Liga de novo
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=America/Sao_Paulo date +%u)
          hm=$((10#$(TZ=America/Sao_Paulo date +%H%M)))
          if [ "$d" -le 5 ] && [ "$hm" -ge 945 ] && [ "$hm" -le 1815 ]; then
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mercado-ao-vivo.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
            echo "turnos ao vivo em andamento ou na fila: $n"
            if [ "$n" = "0" ]; then
              gh workflow run mercado-ao-vivo.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "coleta ao vivo disparada"
            fi
          else
            echo "fora do pregão: nada a fazer"
          fi
