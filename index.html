<style>
:root{--bg:#111317;--card:#181b20;--line:#2a2e35;--txt:#f2f2f0;--mut:#8a8f98;--err:#e5484d;--btn:#f2f2f0;--btnTxt:#111317}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);background-image:radial-gradient(1200px 600px at 50% -10%,#1d2026 0%,var(--bg) 60%);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:360px}
.mark{font-weight:800;font-size:44px;letter-spacing:-1.5px;line-height:1;margin:0 0 6px}
.mark i{font-style:normal;color:var(--mut)}
.sub{color:var(--mut);margin:0 0 28px;font-size:14px;letter-spacing:.2px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
label.l{display:block;font-size:13px;color:var(--mut);margin:0 0 8px}
.pw{position:relative}
input[type=password],input[type=text]{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:#0f1114;color:var(--txt);font-size:16px;padding:0 46px 0 14px;outline:none;transition:border-color .15s}
input:focus{border-color:#5a606a}
.eye{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:transparent;color:var(--mut);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.eye:hover{color:var(--txt)}
.rem{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:#c9ccd1;cursor:pointer;user-select:none}
.rem input{width:16px;height:16px;accent-color:#f2f2f0;margin:0}
button.go{width:100%;height:46px;border:0;border-radius:10px;background:var(--btn);color:var(--btnTxt);font-weight:700;font-size:15px;cursor:pointer;transition:opacity .15s}
button.go:disabled{opacity:.55;cursor:default}
.msg{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--err)}
.msg.info{color:var(--mut)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{color:#5d626b;font-size:12px;margin-top:18px;text-align:center}
.loading{display:none;text-align:center;color:var(--mut);font-size:14px}
.loading .sp{width:22px;height:22px;border:2px solid #2f333a;border-top-color:var(--txt);border-radius:50%;margin:0 auto 12px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
body.abrindo form,body.abrindo .sub{display:none}
body.abrindo .loading{display:block}
</style>
</head>
<body>
<main class="box">
  <h1 class="mark">hub<i>.</i></h1>
  <p class="sub">Hub do Assessor · acesso restrito</p>
  <form id="f" autocomplete="on">
    <label class="l" for="s">Senha</label>
    <div class="pw">
      <input id="s" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="eye" type="button" id="eye" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <label class="rem"><input type="checkbox" id="lem" checked> Lembrar neste aparelho até segunda-feira</label>
    <button class="go" id="go" type="submit">Entrar</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <div class="loading" id="ld"><div class="sp"></div>Abrindo o Hub…</div>
  <p class="foot">Uso interno</p>
</main>
<script>
(function(){
  var K='hubLoginK', KE='hubLoginExp', ARQ='hub.enc', expirou=false;
  var $=function(i){return document.getElementById(i)};
  var arquivo=fetch(ARQ,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();});
  function msg(t,info){var m=$('msg');m.textContent=t||'';m.className='msg'+(info?' info':'');}
  function b64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
  function ub64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function partes(buf){var u=new Uint8Array(buf);if(String.fromCharCode(u[0],u[1],u[2],u[3])!=='HUB1')throw new Error('formato');var it=new DataView(buf).getUint32(4,false);return{it:it,sal:u.slice(8,24),iv:u.slice(24,36),ct:u.slice(36)};}
  function derivar(senha,p){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(senha),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:p.sal,iterations:p.it},k,256);}).then(function(bits){return new Uint8Array(bits);});}
  function decifrar(raw,p){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:p.iv},k,p.ct);});}
  function abrirHtml(gz){
    if(!('DecompressionStream' in window))throw new Error('navegador');
    var st=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(st).text();
  }
  function mostrar(html){document.open();document.write(html);document.close();}
  function proxSegunda(t){var BR=3*3600e3,d=new Date(t-BR),dia=d.getUTCDay(),n=((8-dia)%7)||7;return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+n)+BR;}
  function guardar(raw,lembrar){try{if(lembrar){localStorage.setItem(K,b64(raw));localStorage.setItem(KE,String(proxSegunda(Date.now())));}else{sessionStorage.setItem(K,b64(raw));}}catch(e){}}
  function lida(){var v=null;try{v=sessionStorage.getItem(K);if(!v&&localStorage.getItem(K)){var exp=+localStorage.getItem(KE)||0;if(exp&&Date.now()<exp){v=localStorage.getItem(K);}else{localStorage.removeItem(K);localStorage.removeItem(KE);expirou=true;}}}catch(e){}return v;}
  function esquecer(){try{localStorage.removeItem(K);localStorage.removeItem(KE);sessionStorage.removeItem(K);}catch(e){}}
  function falhaArquivo(e){document.body.classList.remove('abrindo');var t=String(e&&e.message||e);msg(t==='navegador'?'Este navegador é antigo demais para abrir o Hub. Atualize o Safari/Chrome.':'Não consegui carregar o Hub ('+t+'). Verifique a internet e tente de novo.');$('go').disabled=false;}
  // Acesso lembrado
  var salva=lida();
  if(!salva&&expirou)msg('Os acessos salvos são renovados toda segunda-feira. Digite a senha de novo.',true);
  if(salva){
    document.body.classList.add('abrindo');
    arquivo.then(function(buf){var p=partes(buf);return decifrar(ub64(salva),p).then(abrirHtml,function(){esquecer();throw 'senha';});})
      .then(mostrar)
      .catch(function(e){document.body.classList.remove('abrindo');if(e==='senha'){msg('A senha mudou. Entre de novo.',true);}else falhaArquivo(e);$('s').focus();});
  }
  $('eye').addEventListener('click',function(){var s=$('s');s.type=s.type==='password'?'text':'password';s.focus();});
  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var senha=$('s').value;if(!senha)return;
    $('go').disabled=true;msg('Verificando…',true);
    var p,raw;
    arquivo.then(function(buf){p=partes(buf);return derivar(senha,p);})
      .then(function(r){raw=r;return decifrar(raw,p).catch(function(){throw 'senha';});})
      .then(function(gz){guardar(raw,$('lem').checked);document.body.classList.add('abrindo');return abrirHtml(gz);})
      .then(mostrar)
      .catch(function(e){
        if(e==='senha'){$('go').disabled=false;msg('Senha incorreta.');var f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('s').select();}
        else falhaArquivo(e);
      });
  });
})();
</script>
</body>
</html>
