<style>
:root{--bg:#06070a;--card:rgba(12,13,17,.84);--line:rgba(255,255,255,.14);--txt:#f4f3f6;--mut:#a7a4b3;--err:#ff5c7a;--btn:#fff;--btnTxt:#06070a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;background:#06070a;color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
/* tela neutra: sem logo nem cores da Rico. fundo: quadro parado em CSS; por cima entra o filme (canvas) quando o navegador ajuda */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 55% at 80% 78%,rgba(255,255,255,.12),transparent 70%),radial-gradient(55% 60% at 12% 12%,rgba(120,130,170,.14),transparent 72%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:0;transition:opacity 1.1s ease}
#bg.on{opacity:1}
.box{width:100%;max-width:372px}
.mark{font-weight:700;font-size:44px;letter-spacing:.02em;line-height:1;margin:0 0 10px;text-transform:uppercase}
.mark i{font-style:normal;color:var(--mut)}
.sub{color:var(--mut);margin:0 0 30px;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
label.l{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.pw{position:relative}
input[type=password],input[type=text]{width:100%;height:48px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font-size:16px;padding:0 46px 0 14px;outline:none;transition:border-color .15s}
input:focus{border-color:#fff}
.eye{position:absolute;right:6px;top:7px;width:34px;height:34px;border:0;background:transparent;color:var(--mut);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.eye:hover{color:var(--txt)}
.rem{display:flex;align-items:center;gap:8px;margin:16px 0 20px;font-size:13.5px;color:#d3d0dc;cursor:pointer;user-select:none}
.rem input{width:16px;height:16px;accent-color:#f2f2f0;margin:0}
button.go{width:100%;height:48px;border:1px solid #fff;border-radius:4px;background:var(--btn);color:var(--btnTxt);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,opacity .15s}
button.go:hover{background:transparent;color:#fff}
button.go:disabled{opacity:.55;cursor:default}
.msg{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--err)}
.msg.info{color:var(--mut)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{color:#8b8798;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;margin-top:20px;text-align:center}
.loading{display:none;text-align:center;color:var(--mut);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.loading .sp{width:22px;height:22px;border:1px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;margin:0 auto 14px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
body.abrindo form,body.abrindo .sub{display:none}
body.abrindo .loading{display:block}
</style>
</head>

<canvas id="bg" aria-hidden="true"></canvas>
<script>
(function(){try{
  var cv=document.getElementById('bg'),gl=cv.getContext('webgl',{alpha:false,antialias:false,depth:false,powerPreference:'low-power'});if(!gl)return;

  var v=sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'),f=sh(gl.FRAGMENT_SHADER,"#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nuniform vec2 uR;uniform float uT,uS,uCena;uniform vec3 cA,cB,cC,cBase;\nfloat hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}\nfloat tri(float x){return abs(fract(x)-.5)*2.;}\nfloat curva(float x,float i,float t){float f=1.+i*.37;\n return sin(x*1.1*f+t*.21+i*1.7)*.5+sin(x*2.3*f-t*.13+i*4.1)*.28+sin(x*5.1+t*.32+i*2.3)*.09\n  +(tri(x*3.7*f+i*.61+t*.05)-.5)*.12+(tri(x*9.3+i*1.31-t*.08)-.5)*.045;}\nvec3 ceu(vec2 p,float asp){\n vec3 c=cBase*(.75+.5*(p.y+.5));\n vec2 g1=vec2(asp*.34+sin(uT*.05)*.12,-.30+uS*.05), g2=vec2(-asp*.36+cos(uT*.04)*.1,.34-uS*.04), g3=vec2(asp*.05+sin(uT*.03+2.)*.2,.05);\n c+=cA*.34*exp(-dot(p-g1,p-g1)*2.6);\n c+=cC*.30*exp(-dot(p-g2,p-g2)*2.2);\n c+=cB*.12*exp(-dot(p-g3,p-g3)*3.4);\n return c;}\nvec3 fluxo(vec2 p,float asp){\n vec3 col=ceu(p,asp);\n for(int n=0;n<8;n++){float i=float(n),d=i/7.;\n  float x=p.x*(1.7-d*.8)+uS*(.22+d*.55)+i*3.1+uT*(.012+d*.02);\n  float y0=mix(.12,-.41,d*d*.35+d*.65)+p.x*.09-uS*.035*d;\n  float y=y0+curva(x,i,uT)*mix(.04,.14,d);\n  float dy=p.y-y;\n  vec3 ci=mix(cC,mix(cB,cA,smoothstep(.45,1.,d)),smoothstep(0.,.6,d));\n  float abaixo=smoothstep(.0025,-.0025,dy);\n  vec3 corpo=cBase*.8+ci*(.30*exp(dy*5.5)+.02);\n  col=mix(col,corpo,abaixo*mix(.55,.95,d));\n  float w=mix(.0008,.0024,d);\n  col+=ci*(w/(abs(dy)+w)*.9+exp(-abs(dy)*mix(80.,30.,d))*.22)*mix(.28,1.,d);\n }\n float hx=(fract(uT*.021)-.5)*asp*1.15;\n float hy=-.41+hx*.09-uS*.035+curva(hx*.9+uS*.77+21.7+uT*.032,7.,uT)*.14;\n float hd=length(p-vec2(hx,hy));\n col+=cA*exp(-hd*46.)*.9+vec3(1.)*exp(-hd*150.)*.8;\n return col;}\nvec3 infinito(vec2 p,float asp){\n vec3 col=ceu(p,asp);\n float an=.14*sin(uT*.06)+uS*.30; mat2 R=mat2(cos(an),-sin(an),sin(an),cos(an));\n vec2 q=R*(p-vec2(asp*.10-uS*.06,-.03+uS*.05)); q.y*=1.18;\n float a=min(asp*.34,.62)*(1.+uS*.22);\n for(int n=0;n<6;n++){float k=float(n);\n  vec2 qk=q+.022*vec2(sin(q.y*6.+uT*.37+k*1.3),cos(q.x*5.-uT*.29+k*1.9))*(1.+k*.35);\n  float ak=a*(1.+.045*k), r2=dot(qk,qk);\n  float F=r2*r2-2.*ak*ak*(qk.x*qk.x-qk.y*qk.y);\n  vec2 g=vec2(4.*qk.x*r2-4.*ak*ak*qk.x,4.*qk.y*r2+4.*ak*ak*qk.y);\n  float dist=abs(F)/(length(g)+.002);\n  float th=atan(qk.y,qk.x)*sign(qk.x+.0001);\n  float corre=.5+.5*sin(th*3.-uT*.8+k*1.1);\n  vec3 ck=mix(cB,cA,.5+.5*sin(th*2.+k*.9+uT*.1)); ck=mix(ck,cC,step(3.5,k)*.6);\n  float w=.0016+.0012*corre;\n  col+=ck*(w/(dist+w)*(.35+.75*corre)+exp(-dist*34.)*.16)*(1.-k*.11);\n }\n return col;}\nvoid main(){\n vec2 uv=gl_FragCoord.xy/uR; float asp=uR.x/uR.y; vec2 p=vec2((uv.x-.5)*asp,uv.y-.5);\n vec3 col=uCena<.5?fluxo(p,asp):infinito(p,asp);\n col*=1.-.42*dot(p*vec2(.62/asp*1.6,1.05),p*vec2(.62/asp*1.6,1.05));\n col=col/(1.+col*.35);\n col+=(hash(gl_FragCoord.xy+fract(uT)*61.)-.5)*.014;\n gl_FragColor=vec4(max(col,0.),1.);}");if(!v||!f)return;
  var pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  var U=function(n){return gl.getUniformLocation(pr,n);},uR=U('uR'),uT=U('uT');
  gl.uniform1f(U('uS'),0);gl.uniform1f(U('uCena'),0);gl.uniform3f(U('cA'),.6,.62,.7);gl.uniform3f(U('cB'),.42,.44,.52);gl.uniform3f(U('cC'),.22,.24,.32);gl.uniform3f(U('cBase'),.022,.024,.032);
  function med(){var e=Math.min(window.devicePixelRatio||1,1.35)*.72,w=Math.round(innerWidth*e),h=Math.round(innerHeight*e);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}}
  var t=0,u=0,parado=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,vivo=true;
  function q(a){if(!vivo)return;if(!document.getElementById('bg'))return;if(a-u>=31){if(u)t+=Math.min(a-u,120)/1000;u=a;med();gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t+4);gl.drawArrays(gl.TRIANGLES,0,3);cv.className='on';}
    if(!parado&&!document.hidden)requestAnimationFrame(q);}
  document.addEventListener('visibilitychange',function(){if(!document.hidden){u=0;requestAnimationFrame(q);}});
  cv.addEventListener('webglcontextlost',function(e){e.preventDefault();vivo=false;});
  requestAnimationFrame(q);
}catch(e){}})();
</script>
<main class="box">
  <h1 class="mark">hub<i>.</i></h1>
  <p class="sub">Hub do Assessor · acesso restrito</p>
  <form id="f" autocomplete="on">
    <label class="l" for="s">Senha</label>
    <div class="pw">
      <input id="s" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="eye" type="button" id="eye" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <label class="rem"><input type="checkbox" id="lem" checked> Lembrar neste aparelho até segunda-feira</label>
    <button class="go" id="go" type="submit">Entrar</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <div class="loading" id="ld"><div class="sp"></div>Abrindo o Hub…</div>
  <p class="foot">Uso interno</p>
</main>
<script>
(function(){
  var K='hubLoginK', KE='hubLoginExp', ARQ='hub.enc', expirou=false;
  var $=function(i){return document.getElementById(i)};
  var arquivo=fetch(ARQ,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();});
  function msg(t,info){var m=$('msg');m.textContent=t||'';m.className='msg'+(info?' info':'');}
  function b64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
  function ub64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function partes(buf){var u=new Uint8Array(buf);if(String.fromCharCode(u[0],u[1],u[2],u[3])!=='HUB1')throw new Error('formato');var it=new DataView(buf).getUint32(4,false);return{it:it,sal:u.slice(8,24),iv:u.slice(24,36),ct:u.slice(36)};}
  function derivar(senha,p){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(senha),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:p.sal,iterations:p.it},k,256);}).then(function(bits){return new Uint8Array(bits);});}
  function decifrar(raw,p){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:p.iv},k,p.ct);});}
  function abrirHtml(gz){
    if(!('DecompressionStream' in window))throw new Error('navegador');
    var st=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(st).text();
  }
  function mostrar(html){document.open();document.write(html);document.close();}
  function proxSegunda(t){var BR=3*3600e3,d=new Date(t-BR),dia=d.getUTCDay(),n=((8-dia)%7)||7;return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+n)+BR;}
  function guardar(raw,lembrar){try{if(lembrar){localStorage.setItem(K,b64(raw));localStorage.setItem(KE,String(proxSegunda(Date.now())));}else{sessionStorage.setItem(K,b64(raw));}}catch(e){}}
  function lida(){var v=null;try{v=sessionStorage.getItem(K);if(!v&&localStorage.getItem(K)){var exp=+localStorage.getItem(KE)||0;if(exp&&Date.now()<exp){v=localStorage.getItem(K);}else{localStorage.removeItem(K);localStorage.removeItem(KE);expirou=true;}}}catch(e){}return v;}
  function esquecer(){try{localStorage.removeItem(K);localStorage.removeItem(KE);sessionStorage.removeItem(K);}catch(e){}}
  function falhaArquivo(e){document.body.classList.remove('abrindo');var t=String(e&&e.message||e);msg(t==='navegador'?'Este navegador é antigo demais para abrir o Hub. Atualize o Safari/Chrome.':'Não consegui carregar o Hub ('+t+'). Verifique a internet e tente de novo.');$('go').disabled=false;}
  // Acesso lembrado
  var salva=lida();
  if(!salva&&expirou)msg('Os acessos salvos são renovados toda segunda-feira. Digite a senha de novo.',true);
  if(salva){
    document.body.classList.add('abrindo');
    arquivo.then(function(buf){var p=partes(buf);return decifrar(ub64(salva),p).then(abrirHtml,function(){esquecer();throw 'senha';});})
      .then(mostrar)
      .catch(function(e){document.body.classList.remove('abrindo');if(e==='senha'){msg('A senha mudou. Entre de novo.',true);}else falhaArquivo(e);$('s').focus();});
  }
  $('eye').addEventListener('click',function(){var s=$('s');s.type=s.type==='password'?'text':'password';s.focus();});
  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var senha=$('s').value;if(!senha)return;
    $('go').disabled=true;msg('Verificando…',true);
    var p,raw;
    arquivo.then(function(buf){p=partes(buf);return derivar(senha,p);})
      .then(function(r){raw=r;return decifrar(raw,p).catch(function(){throw 'senha';});})
      .then(function(gz){guardar(raw,$('lem').checked);document.body.classList.add('abrindo');return abrirHtml(gz);})
      .then(mostrar)
      .catch(function(e){
        if(e==='senha'){$('go').disabled=false;msg('Senha incorreta.');var f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('s').select();}
        else falhaArquivo(e);
      });
  });
})();
</script>
</body>
</html>
